name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick checks: lint, format, unit tests with coverage, and the web build (about a minute).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npx vitest run --coverage --coverage.reporter=text-summary
      - run: npm run build:web

  # Browser end-to-end tests against the live public APIs. They take about 7 minutes in total, so
  # they are split into 4 shards that run at the same time on separate machines.
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The screenshot spec only refreshes README images, so CI skips it.
      - run: npx playwright test --project=web --grep-invert screenshot --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  # Packages the desktop app (no installers, no publishing) on all three systems, so a packaging
  # problem shows up in a pull request instead of at release time.
  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:electron
      - run: npx electron-builder --dir --publish never

  # Best effort: runs the desktop app's end-to-end tests on Linux under a virtual display.
  # Not required to pass yet (it has not been run on CI before); remove continue-on-error once green.
  electron-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Electron's sandbox uses, so allow
      # them on this runner. Older Electron builds also shipped a setuid chrome-sandbox helper; if
      # this version still has it, give it the ownership and permissions it needs.
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if [ -f node_modules/electron/dist/chrome-sandbox ]; then
            sudo chown root node_modules/electron/dist/chrome-sandbox
            sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          fi
      - run: npm run build:electron
      - run: xvfb-run --auto-servernum npx playwright test --project=electron
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: electron-e2e-results
          path: test-results/
          if-no-files-found: ignore
